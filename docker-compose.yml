services:
  postgres:
    image: postgres:16-alpine
    container_name: balancevault-postgres
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerline_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: balancevault-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Database — never hardcode; always inject at runtime
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ledgerline
      SPRING_DATASOURCE_USERNAME: ledgerline
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-ledgerline_dev_password}
      # JWT — must be a long random secret in production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-openssl-rand-hex-32}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # First-admin bootstrap secret
      ADMIN_BOOTSTRAP_SECRET: ${ADMIN_BOOTSTRAP_SECRET:-balancevault-bootstrap-secret}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
