# =============================================================================
# LedgerLine Application Configuration
# AGENTS.md Rule 2: No ddl-auto, Flyway only. Rule 11: Secrets from environment.
# =============================================================================

spring.application.name=ledgerline
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerline_db}
spring.datasource.username=${DB_USER:ledgerline_user}
# Rule 11: Database password comes strictly from environment variable
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Rule 2: Schema changes only through Flyway migrations. No ddl-auto.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true

# Security & JWT Configuration
# Rule 11: JWT Secret read from environment variable
jwt.secret=${JWT_SECRET:ledgerline-super-secret-jwt-key-minimum-256-bits-for-hmac-sha-signing}
# M1 Requirement: 15 min expiry (15 * 60 * 1000 = 900000 ms)
jwt.expiration-ms=900000

# Error Handling Configuration
# Rule 10: Uniform JSON errors, never leak stack traces
server.error.include-stacktrace=never
server.error.include-message=never

