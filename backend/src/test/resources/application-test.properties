# =============================================================================
# LedgerLine Test Configuration
# Uses H2 in PostgreSQL mode when running without a live PostgreSQL / Docker instance
# =============================================================================

spring.datasource.url=jdbc:h2:mem:ledgerline_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=60000
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=60
spring.datasource.hikari.connection-timeout=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway in test
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common

jwt.secret=test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha-signing-tests
jwt.expiration-ms=900000
